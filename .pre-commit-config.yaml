repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: md-caps
        name: markdown caps
        entry: uv run python scripts/check_md_caps.py
        language: system
        pass_filenames: false
        files: \.md$
      - id: docs-sync
        name: module docs change with modules
        entry: uv run python scripts/check_docs_sync.py --staged
        language: system
        pass_filenames: false
        always_run: true
