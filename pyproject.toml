[project]
name = "super-harness"
dynamic = ["version"]
description = "Run many projects at once with subscription coding-agent CLIs (Claude Code, Codex, Antigravity)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "normatov13" }]
dependencies = [
    "filelock>=3.16",
    "pydantic>=2.9",
    "ruamel-yaml>=0.18",
    "typer>=0.12",
]

[project.scripts]
harness = "super_harness.cli:app"
hrn = "super_harness.cli:app"

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.8",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/super_harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/super_harness"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "super_harness/skills"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
markers = ["live: runs the real provider CLIs; opt in with -m live"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_package = "super_harness"

[[tool.importlinter.contracts]]
name = "Layers: cli | worker | ui > ops > memory > journal | settings > store > model"
type = "layers"
layers = [
    "super_harness.cli | super_harness.worker | super_harness.ui",
    "super_harness.ops",
    "super_harness.memory",
    "super_harness.journal | super_harness.settings",
    "super_harness.store",
    "super_harness.model",
]

[[tool.importlinter.contracts]]
name = "cli, worker and ui reach the store and its units only through ops"
type = "forbidden"
source_modules = ["super_harness.cli", "super_harness.worker", "super_harness.ui"]
forbidden_modules = [
    "super_harness.store",
    "super_harness.settings",
    "super_harness.memory",
    "super_harness.journal",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Engine rules are pure: workflow and scheduler import only model"
type = "forbidden"
source_modules = ["super_harness.workflow", "super_harness.scheduler"]
forbidden_modules = [
    "super_harness.cli",
    "super_harness.ops",
    "super_harness.memory",
    "super_harness.journal",
    "super_harness.settings",
    "super_harness.store",
]

[[tool.importlinter.contracts]]
name = "Adapters and gitops never touch the store: they import only model"
type = "forbidden"
source_modules = ["super_harness.adapters", "super_harness.gitops"]
forbidden_modules = [
    "super_harness.cli",
    "super_harness.ops",
    "super_harness.memory",
    "super_harness.journal",
    "super_harness.settings",
    "super_harness.store",
    "super_harness.workflow",
    "super_harness.scheduler",
]
