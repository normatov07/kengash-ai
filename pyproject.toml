[project]
name = "kengash-ai"
dynamic = ["version"]
description = "Run many projects at once with subscription coding-agent CLIs (Claude Code, Codex, Antigravity)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "normatov13" }]
keywords = ["ai", "agents", "claude-code", "codex", "antigravity", "harness", "kanban", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "filelock>=3.16",
    "pydantic>=2.9",
    "ruamel-yaml>=0.18",
    "ruamel-yaml-clib>=0.2.12; platform_python_implementation == 'CPython'",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/normatov07/kengash-ai"
Repository = "https://github.com/normatov07/kengash-ai"
Issues = "https://github.com/normatov07/kengash-ai/issues"
Changelog = "https://github.com/normatov07/kengash-ai/blob/main/CHANGELOG.md"
Documentation = "https://github.com/normatov07/kengash-ai#readme"

[project.scripts]
kengash = "kengash_ai.cli:app"
# the 0.1.0 names: they warn, then run, until 0.3.0 (SP8 spec decision 1)
harness = "kengash_ai.cli:legacy"
hrn = "kengash_ai.cli:legacy"

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "httpx2>=2.16.0",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.8",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/kengash_ai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kengash_ai"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "kengash_ai/skills"

# what a source release holds; local agent, tool and cache folders never ship
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/skills",
    "/tests",
    "/evals",
    "/scripts",
    "/docs",
    "/.claude-plugin",
    "/.antigravity-plugin",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/GEMINI.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/Makefile",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = ["__pycache__", "*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
# harness runs the official CLIs and git by name from PATH by design (system spec hard
# rule 6), always with argument lists and never a shell string
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# tests assert, use fake tokens, pass `shell=` to the fake CLIs and open the local UI
"tests/**" = ["S101", "S106", "S310", "S604"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
markers = ["live: runs the real provider CLIs; opt in with -m live"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_package = "kengash_ai"

[[tool.importlinter.contracts]]
name = "Layers: cli | worker | ui > ops > memory > journal | settings > store > model"
type = "layers"
layers = [
    "kengash_ai.cli | kengash_ai.worker | kengash_ai.ui",
    "kengash_ai.ops",
    "kengash_ai.memory",
    "kengash_ai.journal | kengash_ai.settings",
    "kengash_ai.store",
    "kengash_ai.model",
]

[[tool.importlinter.contracts]]
name = "cli, worker and ui reach the store and its units only through ops"
type = "forbidden"
source_modules = ["kengash_ai.cli", "kengash_ai.worker", "kengash_ai.ui"]
forbidden_modules = [
    "kengash_ai.store",
    "kengash_ai.settings",
    "kengash_ai.memory",
    "kengash_ai.journal",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Engine rules are pure: workflow and scheduler import only model"
type = "forbidden"
source_modules = ["kengash_ai.workflow", "kengash_ai.scheduler"]
forbidden_modules = [
    "kengash_ai.cli",
    "kengash_ai.ops",
    "kengash_ai.memory",
    "kengash_ai.journal",
    "kengash_ai.settings",
    "kengash_ai.store",
]

[[tool.importlinter.contracts]]
name = "Adapters and gitops never touch the store: they import only model"
type = "forbidden"
source_modules = ["kengash_ai.adapters", "kengash_ai.gitops"]
forbidden_modules = [
    "kengash_ai.cli",
    "kengash_ai.ops",
    "kengash_ai.memory",
    "kengash_ai.journal",
    "kengash_ai.settings",
    "kengash_ai.store",
    "kengash_ai.workflow",
    "kengash_ai.scheduler",
]
