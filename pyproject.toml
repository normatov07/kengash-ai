[project]
name = "super-harness"
dynamic = ["version"]
description = "Run many projects at once with subscription coding-agent CLIs (Claude Code, Codex, Antigravity)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "normatov13" }]
dependencies = [
    "filelock>=3.16",
    "pydantic>=2.9",
    "ruamel-yaml>=0.18",
    "typer>=0.12",
]

[project.scripts]
harness = "super_harness.cli:app"
hrn = "super_harness.cli:app"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/super_harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/super_harness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
