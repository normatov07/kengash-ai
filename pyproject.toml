[project]
name = "super-harness"
dynamic = ["version"]
description = "Run many projects at once with subscription coding-agent CLIs (Claude Code, Codex, Antigravity)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "normatov13" }]
keywords = ["ai", "agents", "claude-code", "codex", "antigravity", "harness", "kanban", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "filelock>=3.16",
    "pydantic>=2.9",
    "ruamel-yaml>=0.18",
    "ruamel-yaml-clib>=0.2.12; platform_python_implementation == 'CPython'",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/normatov07/super-harness"
Repository = "https://github.com/normatov07/super-harness"
Issues = "https://github.com/normatov07/super-harness/issues"
Changelog = "https://github.com/normatov07/super-harness/blob/main/CHANGELOG.md"
Documentation = "https://github.com/normatov07/super-harness#readme"

[project.scripts]
harness = "super_harness.cli:app"
hrn = "super_harness.cli:app"

[project.optional-dependencies]
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "httpx2>=2.16.0",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.8",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/super_harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/super_harness"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "super_harness/skills"

# what a source release holds; local agent, tool and cache folders never ship
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/skills",
    "/tests",
    "/evals",
    "/scripts",
    "/docs",
    "/.claude-plugin",
    "/.antigravity-plugin",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/GEMINI.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/Makefile",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = ["__pycache__", "*.pyc"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
# harness runs the official CLIs and git by name from PATH by design (system spec hard
# rule 6), always with argument lists and never a shell string
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# tests assert, use fake tokens, pass `shell=` to the fake CLIs and open the local UI
"tests/**" = ["S101", "S106", "S310", "S604"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
markers = ["live: runs the real provider CLIs; opt in with -m live"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_package = "super_harness"

[[tool.importlinter.contracts]]
name = "Layers: cli | worker | ui > ops > memory > journal | settings > store > model"
type = "layers"
layers = [
    "super_harness.cli | super_harness.worker | super_harness.ui",
    "super_harness.ops",
    "super_harness.memory",
    "super_harness.journal | super_harness.settings",
    "super_harness.store",
    "super_harness.model",
]

[[tool.importlinter.contracts]]
name = "cli, worker and ui reach the store and its units only through ops"
type = "forbidden"
source_modules = ["super_harness.cli", "super_harness.worker", "super_harness.ui"]
forbidden_modules = [
    "super_harness.store",
    "super_harness.settings",
    "super_harness.memory",
    "super_harness.journal",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Engine rules are pure: workflow and scheduler import only model"
type = "forbidden"
source_modules = ["super_harness.workflow", "super_harness.scheduler"]
forbidden_modules = [
    "super_harness.cli",
    "super_harness.ops",
    "super_harness.memory",
    "super_harness.journal",
    "super_harness.settings",
    "super_harness.store",
]

[[tool.importlinter.contracts]]
name = "Adapters and gitops never touch the store: they import only model"
type = "forbidden"
source_modules = ["super_harness.adapters", "super_harness.gitops"]
forbidden_modules = [
    "super_harness.cli",
    "super_harness.ops",
    "super_harness.memory",
    "super_harness.journal",
    "super_harness.settings",
    "super_harness.store",
    "super_harness.workflow",
    "super_harness.scheduler",
]
