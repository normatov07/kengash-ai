skill: to-plan-with-grill
description: questions with recommended answers first, then a reviewed plan the user approves
notes: >-
  RED 2026-10-23: neither claude (haiku) nor agy created a harness plan; both worked on the
  request directly. REFACTOR: claude appended `echo "exit $?"` after the plan-save heredoc;
  the chained command fell outside `Bash(harness:*)` and was denied, so skills now run each
  harness command as its own call.
files:
  calc.py: "\"\"\"Small arithmetic helpers.\"\"\"\n\n\ndef sub(a: int, b: int) -> int:\n    return a - b\n"
settings: "plan.reviewer: {cli}\nplan.review_max: 1\n"
turns:
  - "/to-plan-with-grill Add an add(a, b) function to calc.py"
  - "Take your recommended answers."
  - "Yes, that is what I want."
  - "Approve it."
expect:
  journal: [plan.created, plan.saved, plan.reviewed, plan.approved]
  plans: {count: 1, fields: {mode: grill, status: approved}}
  clean: true
timeout_s: 900
