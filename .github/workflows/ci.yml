name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or pull request replaces the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # make check, one stage per step: a stage that stalls names itself and stops early
      - name: lint
        run: make lint
        timeout-minutes: 5
      - name: type
        run: make type
        timeout-minutes: 5
      - name: test
        run: make test
        timeout-minutes: 12
      - name: docs
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          make docs DOCS_BASE="$base"
        timeout-minutes: 2

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv build
      - run: python3 scripts/check_dist.py dist
      - name: install the wheel in a clean environment and run it
        run: |
          uv venv "$RUNNER_TEMP/clean" --python 3.12
          VIRTUAL_ENV="$RUNNER_TEMP/clean" uv pip install "$(ls dist/*.whl)[ui]"
          "$RUNNER_TEMP/clean/bin/kengash" --version
          "$RUNNER_TEMP/clean/bin/python" -I -c "import kengash_ai.ui.app, kengash_ai.worker"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: make audit
