name: Bug report
description: Something does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go to the Security tab (private report), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. harness init\n2. ..."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `harness --version` and `harness doctor`
      render: text
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15, Python 3.13, claude 2.1, codex 0.40
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `~/.harness/runtime/logs/`. Remove anything private first.
      render: text
